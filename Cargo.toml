[package]
name = "har-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native HAR inspector built with GPUI"
repository = "https://github.com/thekorn/har-viewer"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui-component", "dep:gpui-component-assets"]

[[bin]]
name = "har-viewer"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
# Compile Metal shaders at runtime so macOS builds need no proprietary Xcode tools.
gpui = { version = "=0.2.2", optional = true, default-features = false, features = ["x11", "wayland", "runtime_shaders"] }
# Last component release compatible with the pinned GPUI engine.
gpui-component = { version = "=0.5.1", optional = true, default-features = false }
gpui-component-assets = { version = "=0.5.1", optional = true }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
