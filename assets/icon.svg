<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">HAR Viewer</title>
  <desc id="description">Three staggered lavender and mint waterfall bars on a rounded charcoal tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.75" y2="1">
      <stop stop-color="#34353e"/>
      <stop offset="0.55" stop-color="#202128"/>
      <stop offset="1" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#646570"/>
      <stop offset="0.35" stop-color="#303139"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5b3ff"/>
      <stop offset="1" stop-color="#a399ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#99f0cf"/>
      <stop offset="1" stop-color="#60d9b0"/>
    </linearGradient>
  </defs>
  <rect x="66" y="66" width="892" height="892" rx="224" fill="url(#tile)" stroke="url(#rim)" stroke-width="4"/>
  <rect x="160" y="280" width="416" height="128" rx="36" fill="url(#lavender)"/>
  <rect x="288" y="456" width="416" height="128" rx="36" fill="url(#lavender)"/>
  <rect x="416" y="632" width="416" height="128" rx="36" fill="url(#mint)"/>
</svg>
